<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theory Paper Fixture</title><style>
      :root{--bg:#f6f7f3;--paper:#fff;--line:#dbe3dc;--ink:#1a2821;--green:#174333}*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:clip}body{background:var(--bg);color:var(--ink);font:17px/1.8 Georgia,serif}.layout{display:grid;grid-template-columns:248px minmax(0,1fr) 288px;min-height:100vh}.toc,.notes{position:sticky;top:0;height:100vh;overflow-y:auto;padding:28px 18px;background:#ffffffea;font-family:system-ui,sans-serif}.toc{border-right:1px solid var(--line)}.notes{border-left:1px solid var(--line)}.toc-list{padding:0;list-style:none}.toc-link{display:block;padding:8px;color:#3d4c43;text-decoration:none}.toc-link.active{color:var(--green);background:#eef5f1}main{min-width:0}.hero,.content{max-width:1000px;margin:auto;padding:44px clamp(24px,5vw,64px)}.hero{padding-bottom:22px}h1,h2{color:var(--green)}section{padding:34px 0;border-top:1px solid var(--line);scroll-margin-top:24px}.evidence-badge{display:inline-flex;margin-left:7px;padding:1px 7px;border-radius:999px;background:#eef4f7;color:#17465d;font:700 12px/1.6 system-ui,sans-serif}.figure{margin:20px 0;border:1px solid var(--line);background:var(--paper)}.figure img{display:block;width:100%;max-height:640px;object-fit:contain;cursor:zoom-in}figcaption{padding:12px}.coverage-notice{padding:14px;border-left:4px solid #a57727;background:#fff9eb}.note-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.note-tab{padding:7px;border:1px solid var(--line);border-radius:999px;background:#fff}.note-tab[aria-selected=true]{color:var(--green);background:#eef5f1}.note-card{margin-top:10px;padding:12px;border:1px solid var(--line);background:#fff}.note-card h3,.note-card p{margin:0}.note-card p{color:#627067;font-size:12px}.lightbox{display:none;position:fixed;inset:0;z-index:9;place-items:center;background:#08100de8}.lightbox.open{display:grid}.lightbox img{max-width:92vw;max-height:86vh}.close{position:fixed;top:16px;right:16px}@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr) 276px;grid-template-areas:'toc toc' 'main notes'}.toc{grid-area:toc;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{grid-area:main}.notes{grid-area:notes}.toc-list{display:flex;gap:4px;overflow-x:auto}.toc-link{white-space:nowrap}.hero,.content{padding:30px 24px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    </style></head><body><div class="layout"><aside class="toc" aria-label="論文目錄"><h2>目錄</h2><ol class="toc-list"><li><a class="toc-link" data-section-link href="#motivation">1.1 問題動機</a></li><li><a class="toc-link" data-section-link href="#derivation">2.1 理論推導</a></li><li><a class="toc-link" data-section-link href="#scope">3.1 適用範圍</a></li></ol></aside><main><header class="hero"><p>Build Paper Site</p><h1>Theory Paper Fixture</h1></header><div class="content"><section id="motivation" data-title="1.1 問題動機"><div class="chapter-label" data-chapter-label>1.1 問題動機</div><h2>問題動機</h2><p data-claim-id="claim-motivation" data-evidence-ids="ev-motivation">問題動機以完整段落說明背景、方法或結果；專有名詞與公式涵義由同章右欄補充。<span class="evidence-badge" data-evidence-id="ev-motivation" data-evidence-kind="paper-stated">p.1 - p.2</span></p></section><section id="derivation" data-title="2.1 理論推導"><div class="chapter-label" data-chapter-label>2.1 理論推導</div><h2>理論推導</h2><p data-claim-id="claim-derivation" data-evidence-ids="ev-derivation">理論推導以完整段落說明背景、方法或結果；專有名詞與公式涵義由同章右欄補充。<span class="evidence-badge" data-evidence-id="ev-derivation" data-evidence-kind="guide-inference">fig. 2</span></p><figure class="figure" data-artifact-id="art-method-fig" data-artifact-kind="figure" data-evidence-ids="ev-derivation"><img data-zoom tabindex="0" role="button" alt="裁切後的方法圖" src="fixture-figure.svg"><figcaption>裁切後的 fig. 2。<span class="evidence-badge" data-evidence-id="ev-derivation" data-evidence-kind="guide-inference">fig. 2</span></figcaption></figure></section><section id="scope" data-title="3.1 適用範圍"><div class="chapter-label" data-chapter-label>3.1 適用範圍</div><h2>適用範圍</h2><div class="coverage-notice" data-coverage-notice data-coverage-status="not reported"><strong>not reported</strong><p>原論文沒有可供本節使用的資料。</p></div></section></div></main><aside class="notes" id="notesPanel" aria-label="章節名詞與公式解釋"><h2 id="noteTitle">章節解釋</h2><div class="note-tabs" role="tablist" aria-label="解釋類型"><button class="note-tab" id="termsTab" type="button" role="tab" aria-selected="true" aria-controls="noteBody" data-note-tab="terms">專有名詞</button><button class="note-tab" id="formulasTab" type="button" role="tab" aria-selected="false" aria-controls="noteBody" data-note-tab="formulas">公式涵義</button></div><div id="noteBody" role="tabpanel" aria-labelledby="termsTab"></div></aside></div><div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true"><button class="close" type="button">×</button><img src="" alt=""></div><script id="notes-data" type="application/json">{"motivation":{"terms":[{"title":"問題動機核心名詞","body":"解釋問題動機段落閱讀時需要先理解的專有概念。"}],"formulas":[]},"derivation":{"terms":[{"title":"理論推導核心名詞","body":"解釋理論推導段落閱讀時需要先理解的專有概念。"}],"formulas":[{"title":"$\\mathcal{L}_{geo}$","body":"幾何損失；數值下降表示預測與幾何監督更一致。"}]},"scope":{"terms":[],"formulas":[]}}</script><script id="guide-manifest" type="application/json">{"paper_id":"fixture-theory","title":"Theory Paper Fixture","paper_type":"theory","language":"zh-Hant","section_order":["motivation","derivation","scope"],"sections":{"motivation":{"status":"present","source_pages":[1],"status_note":""},"derivation":{"status":"present","source_pages":[2],"status_note":""},"scope":{"status":"not reported","source_pages":[],"status_note":"原論文沒有可供本節使用的資料。"}},"evidence":[{"id":"ev-motivation","section_id":"motivation","evidence_kind":"paper-stated","status":"verified","source_pages":[1],"refs":["p.1 - p.2"],"source_locator":"p.1 - p.2","statement":"問題動機的可追溯證據。"},{"id":"ev-derivation","section_id":"derivation","evidence_kind":"guide-inference","status":"verified","source_pages":[],"refs":["fig. 2"],"source_locator":"fig. 2","statement":"理論推導的可追溯證據。"}],"claims":[{"id":"claim-motivation","section_id":"motivation","statement":"問題動機的主要主張。","evidence_ids":["ev-motivation"]},{"id":"claim-derivation","section_id":"derivation","statement":"理論推導的主要主張。","evidence_ids":["ev-derivation"]}],"artifacts":[{"id":"art-method-fig","kind":"figure","section_id":"derivation","asset_path":"fixture-figure.svg","source_locator":"fig. 2","crop":{"source_page":2,"bbox":[20,30,400,260]}}]}</script><script>const links=[...document.querySelectorAll('[data-section-link]')],tabs=[...document.querySelectorAll('[data-note-tab]')],notes=JSON.parse(document.getElementById('notes-data').textContent),noteBody=document.getElementById('noteBody'),noteTitle=document.getElementById('noteTitle');let activeSection='motivation',activeTab='terms';function renderNotes(){noteBody.replaceChildren();noteTitle.textContent=document.getElementById(activeSection).dataset.title;(notes[activeSection][activeTab]||[]).forEach(item=>{const card=document.createElement('article'),title=document.createElement('h3'),body=document.createElement('p');card.className='note-card';title.textContent=item.title;body.textContent=item.body;card.append(title,body);noteBody.append(card)})}links.forEach(link=>link.addEventListener('click',()=>{links.forEach(item=>item.classList.toggle('active',item===link));activeSection=link.hash.slice(1);renderNotes()}));tabs.forEach(tab=>tab.addEventListener('click',()=>{activeTab=tab.dataset.noteTab;tabs.forEach(item=>item.setAttribute('aria-selected',String(item===tab)));renderNotes()}));renderNotes();const lightbox=document.getElementById('lightbox'),lightboxImage=lightbox.querySelector('img');function closeLightbox(){lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true')}document.querySelectorAll('[data-zoom]').forEach(image=>image.addEventListener('click',()=>{lightboxImage.src=image.src;lightboxImage.alt=image.alt;lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false')}));lightbox.querySelector('.close').addEventListener('click',closeLightbox);window.addEventListener('keydown',event=>{if(event.key==='Escape')closeLightbox()});</script></body></html>
